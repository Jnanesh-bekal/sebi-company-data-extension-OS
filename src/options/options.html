<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NISM SEBI Data Collector — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>NISM SEBI Data Collector — Settings</h1>
    <p class="muted">Paste the web app URL you got when deploying <code>apps-script/Code.gs</code>. It must end in <code>/exec</code>. No passwords or keys are stored here.</p>
    <label for="endpoint">Apps Script web app URL</label>
    <input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false">
    <p id="error" class="error" role="alert"></p>
    <div class="row">
      <button id="save" type="button">Save</button>
      <button id="test" type="button" class="secondary">Test connection</button>
    </div>
    <p id="status" class="muted" role="status"></p>
    <p class="muted">“Test connection” only asks the backend whether it is reachable and which Google account you are using. It writes nothing.</p>
  </main>
  <script src="../common/constants.js"></script>
  <script src="../common/validation.js"></script>
  <script src="options.js"></script>
</body>
</html>
